<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ארבעת המינים - הזמנה</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="public">
    <div class="app-shell public-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">4</div>
          <div>
            <p class="eyebrow">הזמנת יהלומים</p>
            <h1>ארבעת המינים</h1>
          </div>
        </div>
        <a href="admin.html" class="ghost-btn small-btn admin-link">כניסה למנהל</a>
      </header>

      <main class="public-panel">
        <section class="panel form-panel public-form-panel">
          <h2>הזמנה</h2>
          <p class="public-subtitle">מלא את הפרטים וניצור איתך קשר בהקדם</p>

          <form id="orderForm">
            <div class="field-grid">
              <label>
                <span>שם מלא</span>
                <input id="customerName" name="customerName" type="text" placeholder="לדוגמה: אבי כהן" required />
              </label>

              <label>
                <span>טלפון</span>
                <input id="customerPhone" name="customerPhone" type="tel" placeholder="050-1234567" required />
              </label>

              <label>
                <span>סוג סט</span>
                <select id="productType" name="productType" required>
                  <option value="">בחר סט</option>
                  <option value="מהודר א">מהודר א</option>
                  <option value="מהודר א מרוקאי">מהודר א מרוקאי</option>
                  <option value="מהודר א תימני">מהודר א תימני</option>
                  <option value="מהודר א א">מהודר א א</option>
                  <option value="מהודר א א מרוקאי">מהודר א א מרוקאי</option>
                  <option value="מהודר א א תימני">מהודר א א תימני</option>
                  <option value="כשר לברכה">כשר לברכה</option>
                  <option value="כשר לברכה מרוקאי">כשר לברכה מרוקאי</option>
                  <option value="כשר לברכה תימני">כשר לברכה תימני</option>
                  <option value="סט רגיל">סט רגיל</option>
                </select>
              </label>

              <label>
                <span>כמות</span>
                <input id="quantity" name="quantity" type="number" min="1" value="1" required />
              </label>

              <label class="checkbox-field">
                <span>האם צריך משלוח?</span>
                <input id="needsDelivery" name="needsDelivery" type="checkbox" />
              </label>

              <label id="deliveryAddressField" class="shipping-address hidden">
                <span>לאן המשלוח</span>
                <textarea id="deliveryAddress" name="deliveryAddress" rows="2" placeholder="כתובת מלאה למשלוח"></textarea>
              </label>
            </div>

            <div class="actions">
              <button type="submit" class="primary-btn">שלח הזמנה</button>
            </div>
            <p id="orderStatus" class="order-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
